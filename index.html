            padding: 9px 18px;

            .clause-item { font-size: 14px; }

</head>

window.LEGAL_FULL_I18N['tw'] = window.LEGAL_FULL_I18N['zh-TW'];

// 언어 정규화 헬퍼 함수
function normalizeLegalLang(rawLang) {
    if (!rawLang) return 'en';
    const str = String(rawLang).trim();
    if (window.LEGAL_FULL_I18N[str]) return str;
    const lower = str.toLowerCase();
    if (lower === 'kr' || lower.startsWith('ko')) return 'ko';
    if (lower === 'tw' || lower === 'zh-tw' || lower === 'zh-hant-tw') return 'zh-TW';
    if (lower === 'hk' || lower === 'zh-hk' || lower === 'zh-mo' || lower === 'zh-hant-hk') return 'zh-HK';
    if (lower.startsWith('zh')) return 'zh-TW';
    const short = lower.split('-')[0].split('_')[0];
    if (window.LEGAL_FULL_I18N[short]) return short;
    return 'en';
}

// 17개국어 전환 및 즉시 렌더링 함수
function switchLanguage(langCode) {
    const normLang = normalizeLegalLang(langCode);
    const data = window.LEGAL_FULL_I18N[normLang] || window.LEGAL_FULL_I18N['en'];

    const badgeEl = document.getElementById('appBadgeText');
    if (badgeEl) badgeEl.innerText = data.badge;

    const metaEmailEl = document.getElementById('metaEmail');
    if (metaEmailEl) metaEmailEl.innerText = data.metaEmail;

    const bodyEl = document.getElementById('legalDynamicBody');
    if (bodyEl) bodyEl.innerHTML = data.bodyHtml;

    const topBtnEl = document.getElementById('btnScrollTop');
    if (topBtnEl) topBtnEl.innerText = data.topBtn;

    const topCloseEl = document.getElementById('topCloseReturnBtn');
    if (topCloseEl) topCloseEl.innerText = data.closeBtn;

    const bottomCloseEl = document.getElementById('bottomCloseReturnBtn');
    if (bottomCloseEl) bottomCloseEl.innerText = data.closeBtn;

    const selectEl = document.getElementById('legalLangSelect');
    if (selectEl && selectEl.value !== normLang) {
        selectEl.value = normLang;
    }

    document.documentElement.lang = normLang;
    document.title = data.mainTitle;
}

// 태블릿 / 모바일 / PC 어디서든 감금(Soft-lock) 없이 즉시 닫고 게임으로 복귀하는 안전 함수
function closeOrReturnToGame() {
    // 1. 인앱 모달(iframe) 내부에서 열렸을 경우 부모 창의 모달 닫기 호출 및 postMessage 전송
    try {
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'CLOSE_LEGAL_MODAL' }, '*');
            if (typeof window.parent.closeLegalWebModal === 'function') {
                window.parent.closeLegalWebModal();
                return;
            }
            return;
        }
    } catch (e) {
        try {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'CLOSE_LEGAL_MODAL' }, '*');
                return;
            }
        } catch (err) {}
    }

    // 2. 만약 opener가 존재하는 팝업/새 탭일 경우 창 닫기 시도
    try {
        if (window.opener && !window.opener.closed) {
            window.close();
            return;
        }
    } catch (e) {}

    // 3. 태블릿/모바일 WebView에서 현재 뷰포트가 이동되어 온 경우 이전 히스토리 또는 본게임(index.html)으로 안전 복귀
    try {
        window.close();
    } catch (e) {}

    setTimeout(function() {
        if (window.history && window.history.length > 1) {
            window.history.back();
        } else {
            window.location.href = 'index.html';
        }
    }, 80);
}

// 부모 창으로부터 실시간 언어 변경 postMessage 수신
window.addEventListener('message', function(event) {

// 초기 로드 시 현재 국가 언어 자동 감지 (URL 파라미터 -> 게임 저장 언어 -> 브라우저 언어 순)
(function initLegalPage() {
    let detectedLang = null;
    try {
        const params = new URLSearchParams(window.location.search);
        if (params.get('inapp') === '1' || (window.self && window.top && window.self !== window.top)) {

        try {
            if (window.self && window.top && window.self !== window.top) {
                document.body.classList.add('inapp-mode');
            }
        } catch (err) {}
    }

    if (!detectedLang) {
        try {
            if (window.parent && window.parent !== window && window.parent.lang) {
                detectedLang = window.parent.lang;
            }
        } catch (e) {}
    }

    if (!detectedLang) {
        try {
            detectedLang = localStorage.getItem('lang') || localStorage.getItem('bm_lang');
        } catch (e) {}
    }

    if (!detectedLang) {
        detectedLang = navigator.language || navigator.userLanguage || 'en';
    }

    switchLanguage(detectedLang);
})();
